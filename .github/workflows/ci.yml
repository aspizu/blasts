name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    fmt:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v3.1.1
              with:
                  runtime: node@26
                  cache: true
            - run: pnpm fmt:check

    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v3.1.1
              with:
                  runtime: node@26
                  cache: true
            - run: pnpm typecheck

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v3.1.1
              with:
                  runtime: node@26
                  cache: true
            - run: pnpm lint

    deploy:
        needs: [fmt, typecheck, lint]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v3.1.1
              with:
                  runtime: node@26
                  cache: true
            - run: pnpm deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
